name: IDENT OS Graphical Live ISO
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build-live-iso.sh'
      - '.github/workflows/graphics.yml'
permissions:
  contents: read
jobs:
  graphical-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian live build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso qemu-system-x86 file
      - name: Validate builder
        run: bash -n scripts/build-live-iso.sh
      - name: Check IDENT desktop Python syntax
        run: python3 -m py_compile desktop/identos-panel.py
      - name: Build graphical ISO
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace debian:trixie \
            sh -ec 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y live-build debootstrap squashfs-tools xorriso ca-certificates && bash scripts/build-live-iso.sh'
      - name: Verify built ISO
        run: |
          test -s build/identos-live-amd64.iso
          (cd build && sha256sum -c identos-live-amd64.sha256)
          file build/identos-live-amd64.iso
      - name: Verify graphical system files in compressed rootfs
        run: |
          sudo apt-get install -y squashfs-tools
          mkdir -p build/iso-check
          xorriso -osirrox on -indev build/identos-live-amd64.iso -extract /live build/iso-check/live
          rootfs="$(find build/iso-check/live -maxdepth 1 -name '*.squashfs' | head -1)"
          test -n "$rootfs"
          unsquashfs -ll "$rootfs" > build/graphics-rootfs-files.txt
          grep -Fq 'usr/bin/openbox' build/graphics-rootfs-files.txt
          grep -Fq 'usr/local/bin/identos-panel' build/graphics-rootfs-files.txt
          grep -Fq 'usr/share/xsessions/identos.desktop' build/graphics-rootfs-files.txt
          grep -Fq 'usr/bin/firefox-esr' build/graphics-rootfs-files.txt
          grep -Fq 'usr/local/bin/identos-browser' build/graphics-rootfs-files.txt
      - name: Headless QEMU kernel boot check
        run: bash scripts/smoke-graphics-qemu.sh
      - name: Publish live ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: identos-graphical-live-amd64
          path: |
            build/identos-live-amd64.iso
            build/identos-live-amd64.sha256
          retention-days: 7
      - name: Upload boot logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: identos-graphics-boot-debug
          path: build/graphics-boot.log
          if-no-files-found: ignore
