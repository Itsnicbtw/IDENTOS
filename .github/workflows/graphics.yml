name: IDENT OS Graphical Live ISO
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build-live-iso.sh'
      - '.github/workflows/graphics.yml'
permissions:
  contents: read
jobs:
  graphical-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian live build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso qemu-system-x86
      - name: Validate builder
        run: bash -n scripts/build-live-iso.sh
      - name: Build graphical ISO
        run: sudo bash scripts/build-live-iso.sh
      - name: Verify built ISO
        run: |
          test -s build/identos-live-amd64.iso
          (cd build && sha256sum -c identos-live-amd64.sha256)
          file build/identos-live-amd64.iso
      - name: Publish live ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: identos-graphical-live-amd64
          path: |
            build/identos-live-amd64.iso
            build/identos-live-amd64.sha256
          retention-days: 7
