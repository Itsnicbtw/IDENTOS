name: IDENTIUM Kernel Build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'kernel/**'
      - 'independent/**'
      - '.github/workflows/identium-kernel.yml'
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - 'independent/**'
      - '.github/workflows/identium-kernel.yml'
permissions:
  contents: read
jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves cpio xz-utils busybox-static qemu-system-x86 python3
      - name: Fetch upstream Linux v6.12 source
        run: |
          curl --fail --location --retry 3 --output /tmp/linux.tar.xz https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.tar.xz
          echo 'UNVERIFIED upstream archive: experimental CI only. Release builds require trusted signature validation.'
          mkdir -p /tmp/identium-src
          tar -xJf /tmp/linux.tar.xz -C /tmp/identium-src --strip-components=1
      - name: Compile IDENTIUM kernel
        run: |
          IDENTIUM_KERNEL_SOURCE=/tmp/identium-src IDENTIUM_KERNEL_JOBS=2 bash kernel/build-identium.sh
      - name: Boot the compiled IDENTIUM kernel with independent PID 1
        run: |
          set -euo pipefail
          export BUSYBOX_STATIC="$(command -v busybox)"
          export BUSYBOX_SHA256="$(sha256sum "$BUSYBOX_STATIC" | cut -d' ' -f1)"
          bash independent/build-rootfs.sh build/identium-boot-rootfs.tar.gz
          bash independent/build-initrd.sh build/identium-boot-rootfs.tar.gz build/identium-boot-initrd.cpio.gz
          set +e
          timeout --signal=TERM 75s bash independent/boot-qemu.sh build/identium-kernel/arch/x86/boot/bzImage build/identium-boot-initrd.cpio.gz </dev/null >build/identium-kernel-boot.log 2>&1
          status=$?
          set -e
          if ! grep -Fq 'IDENT OS | independent minimal rootfs | experimental' build/identium-kernel-boot.log; then
            tail -100 build/identium-kernel-boot.log
            echo "Kernel and initrd did not complete the PID 1 boot test (exit $status)"
            exit 1
          fi
          echo "PASS: compiled IDENTIUM bzImage reached IDENTIUM PID 1"
      - name: Record artifact
        run: |
          sha256sum build/identium-kernel/arch/x86/boot/bzImage
          cat build/identium-kernel/identium-kernel-release.txt
      - uses: actions/upload-artifact@v4
        with:
          name: identium-linux-kernel-amd64-experimental
          path: |
            build/identium-kernel/arch/x86/boot/bzImage
            build/identium-kernel/bzImage.sha256
            build/identium-kernel/identium-kernel-release.txt
            build/identium-kernel/.config
            build/identium-kernel-boot.log
          if-no-files-found: error
          retention-days: 14
