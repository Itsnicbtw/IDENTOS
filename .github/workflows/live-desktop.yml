name: IDENT OS Live Desktop ISO
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-live-iso.sh'
      - '.github/workflows/live-desktop.yml'
      - 'docs/live-desktop.md'
      - 'scripts/check-live-boot-metadata.sh'
  pull_request:
    paths:
      - 'scripts/build-live-iso.sh'
      - '.github/workflows/live-desktop.yml'
      - 'docs/live-desktop.md'
permissions:
  contents: read
jobs:
  desktop-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-common ca-certificates file
      - name: Build graphical ISO
        run: bash scripts/build-live-iso.sh
      - name: Validate checksum
        run: |
          test -s build/identos-live-amd64.iso
          (cd build && sha256sum -c identos-live-amd64.sha256)
          file build/identos-live-amd64.iso
      - name: Verify boot catalog metadata
        run: bash scripts/check-live-boot-metadata.sh
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: identos-live-amd64
          path: |
            build/identos-live-amd64.iso
            build/identos-live-amd64.sha256
          retention-days: 7
          if-no-files-found: error
