name: IDENT OS CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox nano python3 python3-pip python3-venv nodejs npm git gcc g++ make curl tar binutils libc6-dev cpio gzip qemu-system-x86 grub-pc-bin grub-common xorriso mtools e2fsprogs linux-image-virtual
      - name: Verify alpha release diagnostics
        run: bash tests/test-release-readiness.sh
          bash tests/test-persistence-creator.sh
      - name: Validate low-level capability and release integrity contracts
        run: python3 tests/test-low-level.py
      - name: Build and verify IDENT Desktop 2 native C panel
        run: |
          sudo apt-get install -y libgtk-3-dev pkg-config
          cc -O2 -std=c11 -Wall -Wextra -Werror -Wno-error=deprecated-declarations \
            $(pkg-config --cflags gtk+-3.0) desktop/identos2/panel.c \
            -o /tmp/identos-panel2 $(pkg-config --libs gtk+-3.0)
          /tmp/identos-panel2 --self-test
      - name: Validate independent-rootfs safety and init
        run: |
          bash tests/test-independent-rootfs.sh
          bash -n independent/build-vm-disk.sh
          python3 -m unittest discover -s tests -p "test-independent-image.py" -v
          python3 -m unittest discover -s tests -p "test-independent-slots.py" -v
          python3 -m unittest discover -s tests -p "test-independent-repository.py" -v
      - name: Validate scripts and initramfs
        run: |
          bash -n scripts/*.sh
          bash scripts/test.sh
      - name: Verify safe persistence image
        run: bash scripts/test-persistence.sh
      - name: Validate IDENT app packages
        run: python3 tests/test_idt.py
      - name: Validate graphical VM launcher
        run: |
          bash scripts/boot-live-vm.sh --help
          if bash scripts/boot-live-vm.sh --iso /dev/sda 2>/dev/null; then
            echo 'ERROR: VM launcher accepted a physical device' >&2
            exit 1
          fi
      - name: Build bootable ISO
        run: |
          KERNEL_SOURCE="$(find /boot -maxdepth 1 -name 'vmlinuz-*-generic' -type f | head -1)"
          test -n "$KERNEL_SOURCE"
          sudo cp "$KERNEL_SOURCE" build-kernel
          sudo chmod 644 build-kernel
          KERNEL="$PWD/build-kernel" bash scripts/build-iso.sh
          file build/identos-dev-x86_64.iso
          bash scripts/verify-iso.sh
      - name: Smoke test ISO in QEMU
        run: |
          set +e
          timeout 70s bash scripts/run-iso.sh </dev/null >build/qemu-boot.log 2>&1
          status=$?
          set -e
          cat build/qemu-boot.log
          grep -Fq 'IDENT OS | Alpha 0.0.1 | Linux boot prototype' build/qemu-boot.log
          grep -Fq 'identos#' build/qemu-boot.log
          grep -Fq 'Persistent data drive mounted at /data' build/qemu-boot.log
          echo "Boot smoke test passed (QEMU status: $status)"
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: identos-dev-x86_64-iso
          path: |
            build/identos-dev-x86_64.iso
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
