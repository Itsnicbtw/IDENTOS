name: Initramfs checks
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y busybox cpio gzip
      - name: Run checks
        run: ./scripts/test.sh
